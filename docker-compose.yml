services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tower_defense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8580,http://127.0.0.1:8580
      USE_SQLITE: "False"
      DB_NAME: tower_defense
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 2 config.wsgi:application"

  frontend:
    build: ./frontend
    ports:
      - "8580:80"
    depends_on:
      - backend

volumes:
  postgres_data:
